name: resumematcher
services:
    resume-matcher:
        container_name: resume-matcher
        restart: unless-stopped
        volumes:
            - resume-data:/app/backend/data
        image: srbhr/resume-matcher:latest@sha256:95e4d5e564865534292b4ebe34a5f15613c9e23206b7e219ba53e8452fdcfeca
        environment:
            - FRONTEND_BASE_URL=https://resumematcher.local.nimaguoshi.me
        networks:
            - proxy_net
volumes:
    resume-data:

networks:
  proxy_net:
    external: true