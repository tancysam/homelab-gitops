services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest@sha256:f95b691c3df463373258e21a578b404f1eb4c7660e8170a40e3e03c9c8f208a4
    container_name: stirling-pdf
    mem_limit: 768m
    volumes:
      - ./stirling-data:/configs
    restart: unless-stopped
    environment:
      - SECURITY_ENABLELOGIN=false
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
