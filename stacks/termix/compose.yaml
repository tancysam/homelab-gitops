services:
  termix:
    image: ghcr.io/lukegus/termix:latest@sha256:9a30ecec2f4fe471c496472cd91e6cd8bb99845eb2489e645991bbe165dd5d9b
    container_name: termix
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - termix-data:/app/data
    environment:
      PORT: "8080"
    networks:
      - proxy_net
    depends_on:
      - guacd

  guacd:
    image: guacamole/guacd:latest@sha256:2d266a525a72ad55d8ea7cd4ca8342a1b44075759b03660d8684821b3636a922
    container_name: termix-guacd
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true

volumes:
  termix-data:
    driver: local
