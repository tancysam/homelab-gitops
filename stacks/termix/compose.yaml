services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    restart: unless-stopped
    volumes:
      - termix-data:/app/data
    environment:
      PORT: "8080"
    networks:
      - proxy_net
    depends_on:
      - guacd

  guacd:
    image: guacamole/guacd:latest
    container_name: termix-guacd
    restart: unless-stopped
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true

volumes:
  termix-data:
    driver: local
